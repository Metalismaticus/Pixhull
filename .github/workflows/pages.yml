name: Deploy to GitHub Pages

# There is no build step: the repository root *is* the site. This workflow just
# uploads it. `enablement: true` turns Pages on the first time it runs, so the
# repository settings never need to be touched by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check every module parses
        run: |
          shopt -s globstar
          for f in src/**/*.js tools/*.mjs; do
            node --check "$f"
          done

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
