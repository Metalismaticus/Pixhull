name: Publish to GitHub Pages

# There is no build step: the repository root *is* the site. Pages serves the
# `gh-pages` branch, which this workflow keeps as a plain mirror of `main`.
#
# Why not the artifact route (configure-pages / upload-pages-artifact /
# deploy-pages)? Creating a Pages site through the API needs
# `administration:write`, a scope the Actions token cannot be granted, so
# `enablement: true` fails with "Resource not accessible by integration" on a
# repository where Pages has never been switched on. Pushing a `gh-pages`
# branch enables Pages without that permission and without anyone opening the
# repository settings.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone cannot push to an existing branch - the remote
          # rejects it with "shallow update not allowed" because it cannot
          # verify the fast-forward.
          fetch-depth: 0

      # node --check is not enough: it once accepted a string literal broken
      # across two lines that the browser rejected, and the app shipped dead.
      # tools/check.mjs imports each module, which is the real test.
      - name: Check every module parses
        run: node tools/check.mjs

      # Drives the MCP server over stdio end to end. It shares its core with
      # the web app, so this also catches a break in the carve or the exporters.
      - name: Check the MCP server end to end
        run: node tools/mcp-smoke.mjs

      - name: Mirror main to gh-pages
        run: git push origin HEAD:gh-pages
