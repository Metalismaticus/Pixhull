<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixhull — pixel art to 3D</title>
<meta name="description" content="Turn front / side / top pixel art into a 3D voxel model and export pixel-perfect sprite turnarounds. Free, open source, runs entirely in your browser.">
<script>
  // Apply the stored theme before the stylesheet paints, so a light-theme user
  // never sees a dark flash on load.
  try {
    var saved = localStorage.getItem('pixhull.theme');
    document.documentElement.dataset.theme =
      saved === 'light' || saved === 'dark'
        ? saved
        : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  } catch (e) {
    document.documentElement.dataset.theme = 'dark';
  }
</script>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="icon" type="image/webp" sizes="1254x1254" href="assets/icon.webp">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<meta property="og:title" content="Pixhull">
<meta property="og:description" content="Turn front / side / top pixel art into a 3D voxel model and export pixel-perfect sprite turnarounds. Free, open source, runs in your browser.">
<meta property="og:image" content="https://metalismaticus.github.io/Pixhull/assets/icon.webp">
<meta name="twitter:card" content="summary">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <h1>Pixhull</h1>
    <span class="tagline" data-i18n="app.tagline"></span>
  </div>
  <div class="topbar-actions">
    <button id="btn-demo" class="ghost" type="button" data-i18n="app.loadDemo"></button>
    <button id="btn-clear" class="ghost" type="button" data-i18n="app.clear"></button>
    <button id="btn-lang" class="ghost toggle" type="button" data-i18n-title="app.language">EN</button>
    <button id="btn-theme" class="ghost toggle" type="button" data-i18n-title="app.theme" aria-hidden="false">
      <span id="theme-icon">◐</span>
    </button>
    <a class="ghost link" href="download.html" data-i18n="app.getLocal"></a>
    <a class="ghost link" href="https://github.com/Metalismaticus/Pixhull" id="repo-link" target="_blank" rel="noopener" data-i18n="app.source"></a>
  </div>
</header>

<main class="layout">

  <!-- ------------------------------------------------------------------ -->
  <aside class="panel panel-left">
    <h2 data-i18n="views.heading"></h2>
    <p class="hint" data-i18n="views.hint"></p>

    <div id="view-slots" class="view-slots"></div>
    <button id="btn-sheet" class="ghost small" type="button" data-i18n="sheet.open"></button>

    <div class="field">
      <label for="grid-size" data-i18n="grid.label"></label>
      <select id="grid-size">
        <option value="16">16³</option>
        <option value="24">24³</option>
        <option value="32" selected>32³</option>
        <option value="48">48³</option>
        <option value="64">64³</option>
        <option value="96">96³</option>
        <option value="128">128³</option>
        <option value="192">192³</option>
        <option value="256">256³</option>
        <option value="384">384³</option>
        <option value="512">512³</option>
      </select>
      <button id="btn-autofit" class="ghost small" type="button" data-i18n="grid.fit"></button>
    </div>
    <p class="hint" id="grid-hint" data-i18n="grid.hint"></p>

    <button id="btn-build" class="primary" type="button" data-i18n="grid.build"></button>

    <h2 data-i18n="edit.heading"></h2>
    <div class="toolbar" id="tool-bar" role="radiogroup" data-i18n-aria="edit.heading"></div>
    <p class="hint" id="tool-hint"></p>

    <div class="field">
      <label for="brush-size" data-i18n="edit.brush"></label>
      <input type="range" id="brush-size" min="0" max="4" step="1" value="0">
      <span class="unit" id="brush-label">1³</span>
    </div>
    <p class="hint warn hidden" id="brush-note" data-i18n="edit.brushOff"></p>
    <div class="field checkbox">
      <input type="checkbox" id="face-only" checked>
      <label for="face-only" data-i18n="edit.faceOnly"></label>
    </div>
    <p class="hint warn hidden" id="face-only-note" data-i18n="edit.faceOnlyOff"></p>
    <div class="field checkbox">
      <input type="checkbox" id="symmetry-x">
      <label for="symmetry-x" data-i18n="edit.symmetryX"></label>
    </div>

    <div class="field history-row">
      <button id="btn-undo" class="ghost small" type="button" data-i18n="edit.undo" disabled></button>
      <button id="btn-redo" class="ghost small" type="button" data-i18n="edit.redo" disabled></button>
    </div>
    <p class="hint" id="history-note" data-i18n="edit.nothingYet"></p>
    <p class="hint" data-i18n="edit.hint"></p>

    <h2 data-i18n="edit.paletteHeading"></h2>
    <div class="palette-box" id="palette-box" role="radiogroup" data-i18n-aria="edit.paletteHeading"></div>
    <p class="palette-foot" id="palette-foot"></p>
    <p class="hint warn hidden" id="palette-full-note" data-i18n="edit.paletteFullHint"></p>
    <input type="color" id="edit-color" class="offscreen" tabindex="-1" aria-hidden="true">
    <div class="field">
      <input type="color" id="new-color" value="#ff8844" data-i18n-title="edit.newColor">
      <button id="btn-add-color" class="ghost small" type="button" data-i18n="edit.addColor"></button>
    </div>
    <div class="field">
      <button id="btn-merge-colors" class="ghost small" type="button" data-i18n="edit.mergeColors" disabled></button>
    </div>
    <p class="hint" id="merge-note"></p>
  </aside>

  <!-- ------------------------------------------------------------------ -->
  <section class="viewport">
    <canvas id="gl" aria-label="3D model viewport"></canvas>

    <div class="viewport-overlay">
      <div class="angle-chips" id="angle-chips"></div>
      <div class="zoom-chip">
        <button id="zoom-out" type="button" data-i18n-aria="viewport.zoomOut">−</button>
        <span id="zoom-label">4×</span>
        <button id="zoom-in" type="button" data-i18n-aria="viewport.zoomIn">+</button>
      </div>
    </div>

    <div id="viewport-empty" class="viewport-empty">
      <p data-i18n="viewport.emptyTitle"></p>
      <p class="hint"><span data-i18n="viewport.emptyHintBefore"></span><button id="btn-demo-2" class="linkish" type="button" data-i18n="viewport.emptyHintLink"></button><span data-i18n="viewport.emptyHintAfter"></span></p>
    </div>

    <div id="build-progress" class="progress hidden" role="progressbar"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-aria="build.progress">
      <div id="build-progress-fill" class="progress-fill"></div>
    </div>

    <div class="statusbar" id="statusbar"></div>
  </section>

  <!-- ------------------------------------------------------------------ -->
  <aside class="panel panel-right">
    <h2 data-i18n="view.heading"></h2>
    <div class="field">
      <label for="pitch-preset" data-i18n="view.elevation"></label>
      <select id="pitch-preset"></select>
    </div>
    <div class="field checkbox">
      <input type="checkbox" id="shade-toggle" checked>
      <label for="shade-toggle" data-i18n="view.shading"></label>
    </div>
    <div class="field checkbox">
      <input type="checkbox" id="bounds-toggle" checked>
      <label for="bounds-toggle" data-i18n="view.bounds"></label>
    </div>
    <div class="field checkbox">
      <input type="checkbox" id="mirror-toggle" checked>
      <label for="mirror-toggle" data-i18n="view.mirror"></label>
    </div>
    <p class="hint" data-i18n="view.mirrorHint"></p>

    <h2 data-i18n="export.heading"></h2>
    <div class="field">
      <label for="dir-count" data-i18n="export.directions"></label>
      <input type="number" id="dir-count" min="1" max="64" step="1" value="8">
    </div>
    <div class="field">
      <label for="angle-mode" data-i18n="export.angles"></label>
      <select id="angle-mode">
        <option value="clean" selected data-i18n="export.anglesClean"></option>
        <option value="uniform" data-i18n="export.anglesUniform"></option>
      </select>
    </div>
    <p class="hint" id="angle-preview">—</p>
    <div class="field">
      <label for="export-scale" data-i18n="export.scale"></label>
      <input type="number" id="export-scale" min="1" max="16" step="1" value="1">
      <span class="unit" data-i18n="export.scaleUnit"></span>
    </div>
    <div class="field">
      <label for="export-pad" data-i18n="export.padding"></label>
      <input type="number" id="export-pad" min="0" max="64" step="1" value="0">
      <span class="unit" data-i18n="export.paddingUnit"></span>
    </div>
    <div class="field checkbox">
      <input type="checkbox" id="export-shaded">
      <label for="export-shaded" data-i18n="export.shaded"></label>
    </div>
    <p class="hint" id="frame-preview">—</p>

    <button id="btn-export-sheet" class="primary" type="button" data-i18n="export.sheet"></button>
    <button id="btn-export-frames" class="ghost" type="button" data-i18n="export.frames"></button>

    <h2 data-i18n="model.heading"></h2>
    <div class="field checkbox">
      <input type="checkbox" id="obj-smooth">
      <label for="obj-smooth" data-i18n="model.smooth"></label>
    </div>
    <div class="field">
      <label for="obj-relax" data-i18n="model.relax"></label>
      <input type="range" id="obj-relax" min="0" max="6" step="1" value="0" disabled>
      <span class="unit" id="relax-label">0</span>
    </div>
    <p class="hint" data-i18n="model.smoothHint"></p>
    <button id="btn-export-obj" class="ghost" type="button" data-i18n="model.obj"></button>
    <button id="btn-export-glb" class="ghost" type="button" data-i18n="model.glb"></button>
    <button id="btn-export-vox" class="ghost" type="button" data-i18n="model.vox"></button>
    <p class="hint warn hidden" id="vox-note"></p>
    <button id="btn-save" class="ghost" type="button" data-i18n="model.save"></button>
    <button id="btn-load" class="ghost" type="button" data-i18n="model.load"></button>

    <div class="stats" id="stats"></div>
  </aside>
</main>


<dialog id="sheet-dialog" class="sheet-dialog">
  <h2 data-i18n="sheet.heading"></h2>
  <p class="hint" data-i18n="sheet.hint"></p>
  <div class="field">
    <label for="sheet-gap" data-i18n="sheet.gap"></label>
    <input type="range" id="sheet-gap" min="1" max="12" step="1" value="1">
    <span class="unit" id="sheet-gap-label">1</span>
  </div>
  <p class="hint" id="sheet-summary">—</p>
  <div id="sheet-cells" class="sheet-cells"></div>
  <div class="sheet-actions">
    <button id="sheet-cancel" class="ghost" type="button" data-i18n="sheet.cancel"></button>
    <button id="sheet-apply" class="primary" type="button" data-i18n="sheet.apply"></button>
  </div>
</dialog>

<input type="file" id="sheet-input" accept="image/png,image/*" hidden>
<input type="file" id="file-input" accept="image/png,image/*" hidden>
<input type="file" id="project-input" accept="application/json,.pixhull,.json" hidden>

<script type="module" src="src/main.js"></script>
</body>
</html>
