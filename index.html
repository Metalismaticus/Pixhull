<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixhull — pixel art to 3D</title>
<meta name="description" content="Turn front / side / top pixel art into a 3D voxel model and export pixel-perfect sprite turnarounds. Free, open source, runs entirely in your browser.">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23151821'/><path d='M4 6h8v6H4z' fill='%2364d2b3'/><path d='M4 6l4-3 4 3-4 3z' fill='%23a6e9d5'/></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <h1>Pixhull</h1>
    <span class="tagline">front / side / top &rarr; voxels &rarr; sprites</span>
  </div>
  <div class="topbar-actions">
    <button id="btn-demo" class="ghost" type="button">Load demo</button>
    <button id="btn-clear" class="ghost" type="button">Clear</button>
    <a class="ghost link" href="https://github.com/" id="repo-link" target="_blank" rel="noopener">Source</a>
  </div>
</header>

<main class="layout">

  <!-- ------------------------------------------------------------------ -->
  <aside class="panel panel-left">
    <h2>Source views</h2>
    <p class="hint">Drop a PNG on any slot. Any size — each view is placed on the
      grid independently, so views do not have to match.</p>

    <div id="view-slots" class="view-slots"></div>

    <div class="field">
      <label for="grid-size">Grid</label>
      <select id="grid-size">
        <option value="16">16³</option>
        <option value="24">24³</option>
        <option value="32" selected>32³</option>
        <option value="48">48³</option>
        <option value="64">64³</option>
        <option value="96">96³</option>
        <option value="128">128³</option>
        <option value="192">192³</option>
        <option value="256">256³</option>
      </select>
      <button id="btn-autofit" class="ghost small" type="button">Fit to art</button>
    </div>

    <button id="btn-build" class="primary" type="button">Build model</button>
  </aside>

  <!-- ------------------------------------------------------------------ -->
  <section class="viewport">
    <canvas id="gl" aria-label="3D model viewport"></canvas>

    <div class="viewport-overlay">
      <div class="angle-chips" id="angle-chips"></div>
      <div class="zoom-chip">
        <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
        <span id="zoom-label">4×</span>
        <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      </div>
    </div>

    <div id="viewport-empty" class="viewport-empty">
      <p>Nothing built yet.</p>
      <p class="hint">Drop art into a view slot, or <button id="btn-demo-2" class="linkish" type="button">load the demo</button>.</p>
    </div>

    <div class="statusbar" id="statusbar">ready</div>
  </section>

  <!-- ------------------------------------------------------------------ -->
  <aside class="panel panel-right">
    <h2>View</h2>
    <div class="field">
      <label for="pitch-preset">Elevation</label>
      <select id="pitch-preset"></select>
    </div>
    <div class="field checkbox">
      <input type="checkbox" id="shade-toggle" checked>
      <label for="shade-toggle">Face shading (viewport only)</label>
    </div>
    <div class="field checkbox">
      <input type="checkbox" id="bounds-toggle" checked>
      <label for="bounds-toggle">Show grid bounds</label>
    </div>

    <h2>Sprite export</h2>
    <div class="field">
      <label for="dir-count">Directions</label>
      <input type="number" id="dir-count" min="1" max="64" step="1" value="8">
    </div>
    <div class="field">
      <label for="angle-mode">Angles</label>
      <select id="angle-mode">
        <option value="clean" selected>Pixel-clean slopes</option>
        <option value="uniform">Uniform 360/n</option>
      </select>
    </div>
    <p class="hint" id="angle-preview">—</p>
    <div class="field">
      <label for="export-scale">Scale</label>
      <input type="number" id="export-scale" min="1" max="16" step="1" value="1">
      <span class="unit">px / voxel</span>
    </div>
    <div class="field">
      <label for="export-pad">Padding</label>
      <input type="number" id="export-pad" min="0" max="64" step="1" value="0">
      <span class="unit">px</span>
    </div>
    <div class="field checkbox">
      <input type="checkbox" id="export-shaded">
      <label for="export-shaded">Shaded, snapped back to palette</label>
    </div>
    <p class="hint" id="frame-preview">—</p>

    <button id="btn-export-sheet" class="primary" type="button">Export sprite sheet</button>
    <button id="btn-export-frames" class="ghost" type="button">Export frames + JSON</button>

    <h2>Model</h2>
    <button id="btn-export-obj" class="ghost" type="button">Export OBJ + MTL</button>
    <button id="btn-save" class="ghost" type="button">Save project</button>
    <button id="btn-load" class="ghost" type="button">Load project</button>

    <div class="stats" id="stats"></div>
  </aside>
</main>

<input type="file" id="file-input" accept="image/png,image/*" hidden>
<input type="file" id="project-input" accept="application/json,.pixhull,.json" hidden>

<script type="module" src="src/main.js"></script>
</body>
</html>
